<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Login — Machon Meleches Machsheves</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../assets/img/logo.png">
<link rel="stylesheet" href="admin.css?v=1">
</head>
<body>

<div class="login-screen">
  <form class="login-card" id="loginForm" novalidate>
    <img class="login-card__logo" src="../assets/img/logo-cream.svg" alt="">
    <h1>Admin Login</h1>
    <p class="sub">Machon Meleches Machsheves</p>

    <p class="login-error" id="loginError">Incorrect username or password.</p>

    <div class="field-group">
      <label for="user">Username</label>
      <input type="text" id="user" name="user" autocomplete="username" required>
    </div>
    <div class="field-group">
      <label for="pass">Password</label>
      <input type="password" id="pass" name="pass" autocomplete="current-password" required>
    </div>

    <button class="btn btn-primary btn-block" type="submit">Log in</button>

    <p class="demo-note">This page is only reachable at <strong>/admin</strong> and is not linked from the site. Preview login only — real secure login will be connected when this project moves into Lovable.</p>
  </form>
</div>

<script src="admin.js?v=1"></script>
</body>
</html>
